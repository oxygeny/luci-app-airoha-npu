name: 编译luci-app-airoha-npu (APK包)
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖 zstd + 编译必备
        run: |
          sudo apt update
          sudo apt install -y zstd build-essential libncurses-dev git wget jq

      - name: 下载【APK主线SDK】&解压(zstd)
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          # ========== 这里换成 main 分支APK体系的sdk链接！！==========
          wget -qO /opt/sdk.tar.zst https://downloads.openwrt.org/snapshots/targets/airoha/an7583/openwrt-sdk-airoha-an7583_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          tar -I zstd -xf /opt/sdk.tar.zst -C /opt
          # 拉取luci源码
          git clone -b oxygeny https://github.com/oxygeny/luci-app-airoha-npu.git /opt/npu-src
          cd /opt/openwrt-sdk*/package
          cp -R /opt/npu-src/luci-app-airoha-npu .
          cd /opt/openwrt-sdk*
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Compile luci‑app
        run: |
          set -e
          cd /opt/openwrt-sdk*
          make package/luci-app-airoha-npu/compile V=s
          APK_FILE=$(find . -name "luci-app-airoha-npu*.apk")
          if [ -z "$APK_FILE" ]; then
            echo "::error::apk编译产物缺失"
            exit 1
          fi
          echo "APK=$APK_FILE"
          cp "$APK_FILE" ./luci-app-airoha-npu.apk

      - name: Upload apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: ./luci-app-airoha-npu.apk
          retention-days: 7

  release:
    needs: build   # 必须等build完成才跑release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact apk
        uses: actions/download-artifact@v4
        with:
          name: build-apk
          path: ./out

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.release_tag }}
          generate_release_notes: true
          files: ./out/luci-app-airoha-npu.apk
