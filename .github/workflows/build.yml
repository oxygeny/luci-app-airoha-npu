name: 编译luci-app-airoha-npu (APK包)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖 zstd + 编译必备
        run: |
          sudo apt update
          sudo apt install -y zstd build-essential libncurses-dev git wget jq

      - name: 下载【APK主线SDK】&解压(zstd)
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          # ========== 这里换成 main 分支APK体系的sdk链接！！==========
          wget -qO /opt/sdk.tar.zst https://downloads.openwrt.org/snapshots/targets/airoha/an7583/openwrt-sdk-airoha-an7583_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          tar -I zstd -xf /opt/sdk.tar.zst -C /opt
          # 拉取luci源码
          git clone -b oxygeny https://github.com/oxygeny/luci-app-airoha-npu.git /opt/npu-src
          cd /opt/openwrt-sdk*/package
          cp -R /opt/npu-src/luci-app-airoha-npu .
          cd /opt/openwrt-sdk*
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 编译，找apk包
        run: |
          cd /opt/openwrt-sdk*
          make package/luci-app-airoha-npu/compile V=s -j$(nproc)
          # 重点：匹配apk而不是ipk
          APK_PATH=$(find bin/packages/aarch64_generic/base -name "luci-app-airoha-npu*.apk")
          echo "APK=$APK_PATH" >> $GITHUB_ENV
          ls -lh $APK_PATH
          echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
          echo "tag=$(date '+%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.c8 }}
          body: |
             > 

             **架构：aarch64_generic（Airoha AN7583）**
             ✅ OpenWrt main / 25.12+ APK包
             路由器安装命令：`apk add ./luci-app-airoha-npu_xxx.apk`
          tag_name: ${{ env.tag }}
          files: ${{ env.APK }}
